<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Humaniza Fisioterapia</title>
  <desc id="desc">Logo vetorial circular em tons de verde-agua e azul-petroleo, com simbolo humano organico e ramo.</desc>

  <defs>
    <radialGradient id="disc" cx="49%" cy="43%" r="66%">
      <stop offset="0" stop-color="#F7F5F2"/>
      <stop offset="0.68" stop-color="#F7F5F2"/>
      <stop offset="1" stop-color="#EEF3ED"/>
    </radialGradient>
    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34B6C2"/>
      <stop offset="0.52" stop-color="#34B6C2"/>
      <stop offset="1" stop-color="#2495A1"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E4A57"/>
      <stop offset="0.55" stop-color="#0E4A57"/>
      <stop offset="1" stop-color="#0E4A57"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8C5A1"/>
      <stop offset="1" stop-color="#34B6C2"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34B6C2"/>
      <stop offset="1" stop-color="#A8C5A1"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="7" dy="11" stdDeviation="10" flood-color="#0E4A57" flood-opacity="0.18"/>
    </filter>
    <clipPath id="roundClip"><circle cx="600" cy="600" r="565"/></clipPath>
  </defs>

  <!-- Emblema circular -->
  <circle cx="600" cy="600" r="570" fill="url(#disc)" stroke="#ffffff" stroke-width="14"/>
  <g clip-path="url(#roundClip)">
    <path d="M66 310 C25 505 76 764 245 947 C365 1077 500 1115 702 1200 L0 1200 L0 432 Z" fill="url(#swoosh)" opacity="0.96"/>
    <path d="M72 308 C39 500 93 721 251 894 C363 1017 493 1057 710 1188" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.96"/>
    <path d="M600 32 C812 91 1000 278 1084 489" fill="none" stroke="#34B6C2" stroke-width="3" opacity="0.82"/>
  </g>

  <!-- Simbolo humano organico -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#softShadow)">
    <!-- pessoa superior esquerda / fluxo central -->
    <path d="M605 285
             C603 232 579 196 540 185
             C493 172 451 201 446 248
             C441 294 472 331 519 338
             C492 395 503 455 553 500
             C596 539 601 589 575 630
             C553 664 516 680 480 672"
          stroke="url(#aqua)" stroke-width="29"/>

    <!-- pessoa esquerda -->
    <path d="M465 426
             C458 382 425 348 383 347
             C334 346 299 383 303 430
             C307 472 340 499 380 501
             C357 544 361 600 391 638
             C414 667 447 677 472 654"
          stroke="url(#navy)" stroke-width="29"/>

    <!-- pessoa central direita -->
    <path d="M664 349
             C620 344 585 369 578 411
             C571 452 593 477 615 500
             C645 531 656 568 643 610
             C684 612 722 635 733 676
             C745 722 714 763 669 770
             C624 777 585 746 581 699
             C545 717 504 719 469 701"
          stroke="url(#aqua)" stroke-width="29"/>

    <!-- pessoa direita -->
    <path d="M653 480
             C693 481 723 457 730 420
             C737 382 721 356 694 333
             C669 312 671 281 692 264
             C718 243 753 253 776 279
             C810 317 811 370 792 420
             C837 418 877 444 887 487
             C898 533 868 574 824 581
             C779 588 741 557 735 512
             C714 527 686 533 661 528"
          stroke="url(#navy)" stroke-width="29"/>
  </g>

  <!-- Ramo lateral -->
  <g stroke="#34B6C2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M958 811 C1000 733 1022 653 1029 562 C1034 497 1047 449 1066 409" fill="none" stroke-width="5"/>
    <path d="M1029 561 C1006 527 987 502 954 482" fill="none" stroke-width="3"/>
    <path d="M1038 505 C1049 468 1058 445 1071 423" fill="none" stroke-width="3"/>
    <path d="M1018 626 C1052 592 1081 570 1123 554" fill="none" stroke-width="3"/>
    <path d="M1001 704 C1044 677 1072 659 1111 651" fill="none" stroke-width="3"/>
    <path d="M954 482 C951 532 968 571 1019 584 C1017 533 992 498 954 482 Z" fill="url(#leaf)" stroke="none"/>
    <path d="M1066 409 C1030 448 1029 491 1041 527 C1081 497 1095 452 1066 409 Z" fill="url(#leaf)" stroke="none"/>
    <path d="M1123 554 C1077 555 1043 581 1024 620 C1072 620 1107 595 1123 554 Z" fill="url(#leaf)" stroke="none"/>
    <path d="M1111 651 C1065 647 1031 670 1008 708 C1055 713 1090 692 1111 651 Z" fill="url(#leaf)" stroke="none"/>
  </g>

  <!-- Nome e assinatura: texto permanece editavel -->
  <text x="600" y="850" text-anchor="middle" fill="#0E4A57"
        font-family="Montserrat, Avenir Next, Segoe UI, Arial, sans-serif"
        font-size="92" font-weight="400" letter-spacing="19">HUMANIZA</text>

  <g fill="#34B6C2">
    <rect x="350" y="891" width="211" height="4" rx="2"/>
    <rect x="646" y="891" width="211" height="4" rx="2"/>
    <path d="M600 919 C576 899 567 888 567 876 C567 864 576 855 588 855 C597 855 604 861 608 870 C612 861 619 855 628 855 C640 855 649 864 649 876 C649 888 640 899 600 919 Z"/>
  </g>

  <text x="600" y="960" text-anchor="middle" fill="#0E4A57"
        font-family="Montserrat, Avenir Next, Segoe UI, Arial, sans-serif"
        font-size="39" font-weight="400" letter-spacing="15">FISIOTERAPIA</text>
</svg>
